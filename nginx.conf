events {
    worker_connections 1024;
}

http {
    upstream game_engine {
        server game-engine:8000;
    }
    
    upstream user_manager {
        server user-manager:8001;
    }
    
    upstream session_manager {
        server session-manager:8003;
    }
    
    upstream analytics_service {
        server analytics-service:8004;
    }
    
    upstream notification_service {
        server notification-service:8005;
    }

    server {
        listen 80;
        server_name localhost;

        # Game Engine API
        location /api/games/ {
            proxy_pass http://game_engine;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # User Manager API
        location /api/users/ {
            proxy_pass http://user_manager;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Session Manager API
        location /api/sessions/ {
            proxy_pass http://session_manager;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Analytics Service API
        location /api/analytics/ {
            proxy_pass http://analytics_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Notification Service API
        location /api/notifications/ {
            proxy_pass http://notification_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check endpoint
        location /health {
            return 200 "OK";
            add_header Content-Type text/plain;
        }

        # Default location
        location / {
            return 404 "Not Found";
            add_header Content-Type text/plain;
        }
    }
}